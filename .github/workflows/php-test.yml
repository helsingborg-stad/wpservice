name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  XDEBUG_MODE: off

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']

    steps:
    - uses: actions/checkout@v2

    - name: Setup PHP with composer v2
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        tools: composer:v2

    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
    - uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Remove installer paths
      run: composer config --unset extra.installer-paths

    - name: Install dependencies
      run: composer install --prefer-dist

    - name: Run unit tests
      run: composer test

    - name: Check PHP syntax and compile-time deprecations
      run: |
        find src generator -name '*.php' -print0 | xargs -0 -n1 -P4 sh -c '
          output=$(php -d error_reporting=32767 -d display_errors=1 -l "$0" 2>&1)
          status=$?
          case "$output" in
            *"Deprecated:"*|*"Warning:"*|*"Fatal error:"*|*"Parse error:"*)
              printf "%s\n" "$output"
              exit 1
              ;;
          esac
          exit "$status"
        '
